on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

name: R-CMD-check

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macOS-latest,   r: 'release'}
          - {os: ubuntu-latest,   r: 'devel'}
          - {os: ubuntu-latest,   r: 'release'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v3
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          # Install available packages without specifying exact versions
          sudo apt-get install -y libflint-dev libgmp-dev libmpfr-dev build-essential
          sudo ldconfig
          # Verify installation
          pkg-config --exists flint && echo "FLINT found" || echo "FLINT not found via pkg-config"
          find /usr -name "libflint*" 2>/dev/null | head -3
          ldconfig -p | grep flint || echo "No FLINT in library cache"

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install flint gmp mpfr

      - name: Configure package
        run: |
          chmod +x configure
          ./configure

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - name: Check shared library dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          echo "Checking if we can build and link..."
          cd src
          # Simple test compilation
          echo '#include <stdio.h>' > test.c
          echo 'int main(){printf("test"); return 0;}' >> test.c
          gcc $(pkg-config --cflags --libs flint || echo "-lflint -lgmp -lmpfr") test.c -o test && ./test && echo "Basic linking works"
          rm -f test.c test

      - uses: r-lib/actions/check-r-package@v2
        env:
          # Set library path for runtime
          LD_LIBRARY_PATH: /usr/lib/x86_64-linux-gnu:/usr/local/lib:${{ env.LD_LIBRARY_PATH }}
