on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

name: R-CMD-check

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macOS-latest, r: 'release'}
          - {os: ubuntu-latest, r: 'devel'}
          - {os: ubuntu-latest, r: 'release'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v3
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libflint-dev libgmp-dev libmpfr-dev build-essential
          sudo ldconfig
          echo "=== FLINT installation check ==="
          find /usr -name "*flint*" 2>/dev/null | head -10
          nm -D /usr/lib/x86_64-linux-gnu/libflint.so 2>/dev/null | grep acb_ | head -5 || echo "No ACB symbols found"

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install flint gmp mpfr

      - name: Test FLINT ACB symbols (Linux)
        if: runner.os == 'Linux'
        run: |
          echo "Testing ACB symbol availability..."
          cat > test_acb.c << 'EOF'
          #include <flint/flint.h>
          #include <flint/acb.h>
          int main() {
              acb_t x, y;
              acb_init(x); acb_init(y);
              acb_pow(y, x, x, 64);
              acb_clear(x); acb_clear(y);
              return 0;
          }
          EOF
          gcc $(pkg-config --cflags --libs flint) test_acb.c -lm -o test_acb && echo "ACB symbols available" || echo "ACB symbols missing"
          rm -f test_acb.c test_acb

      - name: Configure package
        run: |
          chmod +x configure
          ./configure

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        env:
          LD_LIBRARY_PATH: /usr/lib/x86_64-linux-gnu:/usr/local/lib:${{ env.LD_LIBRARY_PATH }}
